services:
  db:
    image: postgres:16-alpine
    container_name: buscaviajes_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buscaviajes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-buscaviajes_db}
    ports:
      - "${POSTGRES_PORT:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-buscaviajes} -d $${POSTGRES_DB:-buscaviajes_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buscaviajes_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://buscaviajes:supersecretpassword@db:5432/buscaviajes_db}
    ports:
      - "8090:8000"
    volumes:
      - ./app:/code/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

